# Gateway check for the staff sponsor invite.
# A member JWT is still a valid token, so the function also calls requireStaff.

[functions.invite-sponsor]
verify_jwt = true

[functions.majlis-apply]
verify_jwt = true

[functions.majlis-approve]
verify_jwt = true

[functions.majlis-rsvp]
verify_jwt = true

[functions.majlis-ics]
verify_jwt = true

[functions.majlis-admin-action]
verify_jwt = true

# Cron uses MAJLIS_CRON_SECRET or the service role. The anon key is not enough.
[functions.majlis-reminders]
verify_jwt = false

[functions.due-diligence-start]
verify_jwt = true

# Member mandate intro. The anon key alone is not enough.
[functions.request-mandate-intro]
verify_jwt = true

# Real estate opportunity intro. The anon key alone is not enough.
[functions.request-re-intro]
verify_jwt = true

[functions.due-diligence-status]
verify_jwt = true

# One pipeline step. verify_jwt stays off so a non-JWT service key is not rejected
# by the gateway before this function runs. The caller must send header x-dd-step
# equal to BA_DD_STEP_SECRET from the Edge secret store. An unset secret rejects
# every call. No cron.
[functions.due-diligence-step]
verify_jwt = false

# LinkedIn token exchange. Deploy this function later. Secrets stay in the Edge secret store.
[functions.linkedin-oauth]
verify_jwt = true

# Daily GitHub Action. Header x-invite-reminder must match INVITE_REMINDER_SECRET.
# verify_jwt stays off so the anon key is not a credential. An unset secret rejects every call.
[functions.remind-member-invites]
verify_jwt = false

# Staff dry run of the admitted-member LinkedIn share letter. requireStaff as well.
[functions.admit-li-share-dry-run]
verify_jwt = true

# Member Home card. The show flag is read in the function, not in the client bundle.
[functions.admit-li-share-card]
verify_jwt = true

# Email and Home card click. An unguessable token is the credential. verify_jwt stays off.
[functions.admit-li-share-go]
verify_jwt = false

# Daily GitHub Action. Header x-admit-li-share-reminder must match ADMIT_LI_SHARE_REMINDER_SECRET.
# The function also stays quiet unless ADMIT_LI_SHARE_REMINDER_ENABLED is the exact string true.
[functions.remind-admit-li-share]
verify_jwt = false

# Member deal rooms. The anon key alone is not enough.
# Each function also checks an active member, or staff for the staff function.
[functions.deal-room-create]
verify_jwt = true

[functions.deal-room-invite]
verify_jwt = true

[functions.deal-room-respond]
verify_jwt = true

[functions.deal-room-manage]
verify_jwt = true

[functions.deal-room-staff]
verify_jwt = true

# Member Help note. The anon key alone is not enough. Address comes from ADMIN_NOTIFY_EMAIL.
[functions.contact-desk]
verify_jwt = true

# Accepted desk intro. The anon key alone is not enough. Address comes from ADMIN_NOTIFY_EMAIL.
[functions.notify-desk-intro]
verify_jwt = true

# Public consent log. The anon key is the gateway credential.
# The function inserts one row and stores no IP and no user agent.
[functions.consent-log]
verify_jwt = true

# Public registration. Turnstile plus the service role inside the function.
# The anon key is not a credential for the candidates table.
[functions.register-candidate]
verify_jwt = false

# Email code or one-time link. Returns a sign-in token hash after a match.
[functions.verify-candidate]
verify_jwt = false

# Signed-in candidate. The service role inside the function submits or replies.
[functions.request-membership]
verify_jwt = true

# Staff review. Review call reads PRIVATE_BOOKING_LINK and never returns it.
[functions.review-membership]
verify_jwt = true

# Staff marketing aggregates. The read key is the secret POSTHOG_PERSONAL_API_KEY.
# Absent key, or ANALYTICS_ENABLED not exactly true, returns not_live. No key in the repo.
[functions.marketing-stats]
verify_jwt = true

# Reminder cron. Header x-membership-reminder must match MEMBERSHIP_REMINDER_SECRET.
[functions.remind-membership]
verify_jwt = false

# Signed-in candidate. Refuses a member or staff sign-in.
[functions.delete-candidate-account]
verify_jwt = true

# Daily GitHub Action. Header x-retention-sweep must match RETENTION_SWEEP_SECRET.
# verify_jwt stays off so the anon key is not a credential. An unset secret rejects every call.
# dry_run=1 lists rows and does not delete. POST only.
# Redeploy after the AI tools migration so staged files are purged with the Storage API.
[functions.retention-sweep]
verify_jwt = false

# Member AI tool frame. Start, status, step, delete, and search status. The anon key is not enough.
# Market brief reads the existing Edge secret BA_DD_SEARCH_API_KEY. No new secret name.
# A missing key returns search not configured and does not invent sources.
[functions.ai-tool-job]
verify_jwt = true

# Daily suggestions and nudges. Header x-intros-schedule-secret must match INTROS_SCHEDULE_SECRET.
# verify_jwt stays off so the anon key is not a credential. An unset secret rejects every call.
# ?dry_run=1 returns the plan and does not write or send. POST only.
[functions.suggest-intros]
verify_jwt = false

# Weekly peer invite refill. Header x-invite-weekly-refill must match INVITE_WEEKLY_REFILL_SECRET.
# verify_jwt stays off so the anon key is not a credential. An unset secret rejects every call.
# ?dry_run=1 reports counts and does not write. POST only. Schedule is set after deploy.
[functions.refill-weekly-invites]
verify_jwt = false
