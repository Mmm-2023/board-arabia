# Gateway check for the staff sponsor invite.
# A member JWT is still a valid token, so the function also calls requireStaff.

[functions.invite-sponsor]
verify_jwt = true

[functions.majlis-apply]
verify_jwt = true

[functions.majlis-approve]
verify_jwt = true

[functions.majlis-rsvp]
verify_jwt = true

[functions.majlis-ics]
verify_jwt = true

[functions.majlis-admin-action]
verify_jwt = true

# Cron uses MAJLIS_CRON_SECRET or the service role. The anon key is not enough.
[functions.majlis-reminders]
verify_jwt = false

[functions.due-diligence-start]
verify_jwt = true

# Member mandate intro. The anon key alone is not enough.
[functions.request-mandate-intro]
verify_jwt = true

# Real estate opportunity intro. The anon key alone is not enough.
[functions.request-re-intro]
verify_jwt = true

[functions.due-diligence-status]
verify_jwt = true

# One pipeline step. The previous step calls it with SUPABASE_SERVICE_ROLE_KEY, already in the Edge env.
# verify_jwt stays on. No new secret and no cron.
[functions.due-diligence-step]
verify_jwt = true

# LinkedIn token exchange. Deploy this function later. Secrets stay in the Edge secret store.
[functions.linkedin-oauth]
verify_jwt = true

# Daily GitHub Action. Header x-invite-reminder must match INVITE_REMINDER_SECRET.
# verify_jwt stays off so the anon key is not a credential. An unset secret rejects every call.
[functions.remind-member-invites]
verify_jwt = false

# Staff dry run of the admitted-member LinkedIn share letter. requireStaff as well.
[functions.admit-li-share-dry-run]
verify_jwt = true

# Member Home card. The show flag is read in the function, not in the client bundle.
[functions.admit-li-share-card]
verify_jwt = true

# Email and Home card click. An unguessable token is the credential. verify_jwt stays off.
[functions.admit-li-share-go]
verify_jwt = false

# Daily GitHub Action. Header x-admit-li-share-reminder must match ADMIT_LI_SHARE_REMINDER_SECRET.
# The function also stays quiet unless ADMIT_LI_SHARE_REMINDER_ENABLED is the exact string true.
[functions.remind-admit-li-share]
verify_jwt = false

# Member deal rooms. The anon key alone is not enough.
# Each function also checks an active member, or staff for the staff function.
[functions.deal-room-create]
verify_jwt = true

[functions.deal-room-invite]
verify_jwt = true

[functions.deal-room-respond]
verify_jwt = true

[functions.deal-room-manage]
verify_jwt = true

[functions.deal-room-staff]
verify_jwt = true

# Member Help note. The anon key alone is not enough. Address comes from ADMIN_NOTIFY_EMAIL.
[functions.contact-desk]
verify_jwt = true
