# One unused-invite reminder per day. No-op until INVITE_REMINDER_SECRET is set
# on this repository and the same value is set as an Edge secret.
# The function also dry-runs when Workspace mail secrets are missing, and it
# releases the claim so the reminder is not consumed.

name: Invite reminders

on:
  schedule:
    - cron: '20 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Remind unused peer invites
        env:
          INVITE_REMINDER_SECRET: ${{ secrets.INVITE_REMINDER_SECRET }}
        run: |
          if [ -z "$INVITE_REMINDER_SECRET" ]; then
            echo "INVITE_REMINDER_SECRET is unset. Reminder run is a no-op."
            exit 0
          fi
          code=$(curl -sS --max-time 60 -o /tmp/invite-reminder-body.txt -w '%{http_code}' \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-invite-reminder: ${INVITE_REMINDER_SECRET}" \
            --data '{}' \
            "https://iirqbizwanyhgkhanntq.supabase.co/functions/v1/remind-member-invites")
          echo "status ${code}"
          python3 - <<'PY'
          import pathlib, re
          text = pathlib.Path("/tmp/invite-reminder-body.txt").read_text(encoding="utf-8", errors="replace")
          text = re.sub(r"[\w.+-]+@[\w.-]+\.[A-Za-z]{2,}", "[redacted]", text)
          print(text[:300])
          PY
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "reminder call failed"
            exit 1
          fi
