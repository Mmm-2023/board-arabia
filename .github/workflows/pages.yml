name: Deploy GitHub Pages

on:
  push:
    branches: [main, cursor/landing-ia-10bf, cursor/admin-login-a54a]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        env:
          GITHUB_PAGES: 'true'
          VITE_BASE_PATH: /board-arabia/
          VITE_SUPABASE_URL: https://iirqbizwanyhgkhanntq.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlpcnFiaXp3YW55aGdraGFubnRxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNzMzMjEsImV4cCI6MjEwNTY0OTMyMX0.VSxdt1GVSka1Il7oozc6K_9pIKy8zFYegomBvWgOQDY
        run: npm run build
      - name: Confirm Pages artifact
        run: |
          test -f dist/.nojekyll
          test -f dist/404.html
          test -f dist/for-members/index.html
          test -f dist/robots.txt
          grep -q '/board-arabia/' dist/index.html
          grep -q 'Board Arabia' dist/for-members/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
