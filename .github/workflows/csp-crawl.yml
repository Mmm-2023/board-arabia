name: CSP report-only crawl

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chrome
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
      - name: Build with the Turnstile test key
        run: node scripts/build-for-csp-crawl.mjs
      - name: Crawl dist with the report-only policy
        run: node scripts/csp-crawl.mjs
