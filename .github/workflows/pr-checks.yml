name: PR checks

on:
  pull_request:
    branches: [main, cursor/app-1-capacitor-shell-88cd]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start Postgres
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres createuser --superuser "$USER"
      - name: Build
        env:
          GITHUB_PAGES: 'true'
          VITE_BASE_PATH: /
          VITE_LEGAL_CONTACT_EMAIL: ${{ vars.VITE_LEGAL_CONTACT_EMAIL }}
        run: node scripts/build-for-csp-crawl.mjs
      - name: Test
        run: |
          cp .env.example .env
          node --experimental-strip-types --test scripts/*.test.ts
      - name: Confirm Pages artifact
        run: bash -eo pipefail scripts/pages-artifact-gate.sh
