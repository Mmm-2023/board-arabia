<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Real estate switch</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function (event) {
        var root = document.getElementById('root')
        if (root && !root.textContent) root.textContent = event.message || 'script error'
      })
      var client = document.createElement('script')
      client.type = 'module'
      client.src = '/@vite/client'
      client.addEventListener('error', function () {
        document.getElementById('root').textContent = 'vite client failed'
      })
      client.addEventListener('load', function () {
        var app = document.createElement('script')
        app.type = 'module'
        app.src = './re-switch-main.tsx'
        app.addEventListener('error', function () {
          var root = document.getElementById('root')
          if (root && !root.textContent) root.textContent = 'app module failed'
        })
        document.body.appendChild(app)
      })
      document.head.appendChild(client)
    </script>
  </body>
</html>
